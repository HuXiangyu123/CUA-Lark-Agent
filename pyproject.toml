[project]
name = "cua-lark-agent"
version = "0.1.0"
description = "Feishu desktop GUI testing agent driven by screenshots, a general VLM, and GUI actions."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain>=1.2.15",
  "langchain-openai>=1.0.0",
  "openai>=1.58.0",
  "pydantic>=2.7.4",
  "python-dotenv>=1.0.0",
  "pyautogui>=0.9.54",
  "pygetwindow>=0.0.9",
  "pyperclip>=1.9.0",
  "pillow>=12.2.0",
]

[tool.uv]
package = false
